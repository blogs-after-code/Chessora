<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game - Chessora</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Chessora</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <main id="content" class="wide" hidden>
    <p><a href="/dashboard.html">&larr; Back to library</a></p>
    <h1 id="title"></h1>
    <p id="meta" class="hint"></p>
    <p id="error" class="error" role="alert"></p>
    <div class="viewer">
      <canvas id="board" width="480" height="480" aria-label="Chessboard"></canvas>
      <section class="panel moves-panel">
        <div class="buttons">
          <button type="button" id="first" aria-label="First position">&laquo;</button>
          <button type="button" id="prev" aria-label="Previous move">&lsaquo;</button>
          <button type="button" id="next" aria-label="Next move">&rsaquo;</button>
          <button type="button" id="last" aria-label="Last position">&raquo;</button>
          <button type="button" id="flip">Flip</button>
        </div>
        <ol id="moves" class="moves"></ol>
      </section>
    </div>
  </main>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
