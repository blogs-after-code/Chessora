<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chessora</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Chessora</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <section class="hero">
    <h1>Chess content toolkit for creators</h1>
    <p>Turn your games into GIFs, blunder clips and memes.</p>
    <span id="health" class="badge">Server: checking...</span>
  </section>
  <main>
    <canvas id="board" width="480" height="480" aria-label="Chessboard"></canvas>
    <section class="controls">
      <label for="fen">Position (FEN)</label>
      <input id="fen" type="text" spellcheck="false" autocomplete="off">
      <p id="error" class="error" role="alert"></p>
      <label for="theme">Board theme</label>
      <select id="theme"></select>
      <button id="flip" type="button">Flip board</button>
    </section>
  </main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
