<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Chessora</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Chessora</a>
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <main class="card-page">
    <form class="card" data-mode="login" novalidate>
      <h1>Log in</h1>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <p class="error" data-error-for="email"></p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" data-error-for="password"></p>
      <p id="form-error" class="error" role="alert"></p>
      <button type="submit">Log in</button>
      <p class="hint">New here? <a href="/signup.html">Create an account</a></p>
    </form>
  </main>
  <script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
